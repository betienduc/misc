<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...✍(◔◡◔)</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video {
            max-width: 100%;
            max-height: 100vh;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <video id="myVideo" src="./tripletxcookpardon.mp4" controls loop playsinline></video>
    <video id="myVideo2" src="./Fazbear Frights.mp4" controls loop playsinline></video>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('myVideo');

            video.play().catch(() => {
                console.log("Trình duyệt chặn autoplay có tiếng. Đang chờ user click...");
                document.body.addEventListener('click', () => {
                    video.play();
                }, { once: true });
            });
        });
    </script>

</body>
</html>
